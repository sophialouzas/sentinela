<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h2>🏥 Sistema Hospitalar</h2>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<script>
function login() {
  fetch("/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      usuario: usuario.value,
      senha: senha.value
    })
  })
  .then(r => r.json())
  .then(data => {

    if (!data.sucesso) {
      alert(data.mensagem || "Usuário ou senha incorretos.");
      return;
    }

    if (data.usuario.tipo === "triagem") {
      location.href = "triagem.html";
      return;
    }

    if (data.usuario.tipo === "medico") {
      location.href = "medico.html";
      return;
    }

    if (data.usuario.tipo === "atendimento") {
      location.href = "atendimento.html";
      return;
    }

    alert("Tipo de usuário não reconhecido.");

  })
  .catch(error => {
    console.error("Erro no login:", error);
    alert("Não foi possível conectar ao servidor.");
  });
}
</script>
</body>
</html>
