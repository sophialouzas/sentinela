
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <title>Alta Hospitalar</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Biblioteca para gerar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    .alta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-voltar {
      background: #6c757d;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-voltar:hover {
      background: #545b62;
    }

    .paciente-info {
      background: #f0f4ff;
      border: 1px solid #d0d8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .paciente-info h3 {
      margin-top: 0;
    }

    .btn-salvar-alta {
      background: #dc3545;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
    }

    .btn-salvar-alta:hover {
      background: #b02a37;
    }

    .btn-salvar-alta:disabled {
      background: #999;
      cursor: not-allowed;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .mensagem {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }

    .sucesso {
      background: #d4edda;
      color: #155724;
    }

    .erro {
      background: #f8d7da;
      color: #721c24;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="alta-header">

    <h2>🏥 Alta Hospitalar</h2>

    <button
      class="btn-voltar"
      onclick="voltar()"
    >
      ← Voltar ao Médico
    </button>

  </div>


  <!-- INFORMAÇÕES DO PACIENTE -->

  <div class="paciente-info">

    <h3>Paciente selecionado</h3>

    <p>
      <b>Nome:</b>
      <span id="nomePaciente">Carregando...</span>
    </p>

    <p>
      <b>ID:</b>
      <span id="idPaciente">—</span>
    </p>

  </div>


  <!-- FORMULÁRIO DE ALTA -->

  <h3>Informações da Alta</h3>


  <label for="diagnostico">
    O que o paciente tinha / Diagnóstico final
  </label>

  <input
    type="text"
    id="diagnostico"
    placeholder="Informe o que o paciente tinha"
  >


  <label for="orientacoes">
    Orientações ao paciente
  </label>

  <textarea
    id="orientacoes"
    placeholder="Digite as orientações para o paciente..."
  ></textarea>


  <label for="retorno">
    Retorno
  </label>

  <input
    type="text"
    id="retorno"
    placeholder="Ex: Retornar em 7 dias"
  >


  <label for="observacoes">
    Observações
  </label>

  <textarea
    id="observacoes"
    placeholder="Observações adicionais..."
  ></textarea>


  <br>


  <!-- BOTÃO QUE SALVA E GERA PDF -->

  <button
    class="btn-salvar-alta"
    id="btnSalvar"
    onclick="salvarAlta()"
  >
    🏥 Confirmar Alta e Gerar PDF
  </button>


  <div
    id="mensagem"
    class="mensagem"
  ></div>


</div>


<script>


// ==========================================
// DADOS DO PACIENTE
// ==========================================

const params = new URLSearchParams(
  window.location.search
);

const pacienteId = params.get("id");

const nomePaciente = params.get("nome");


document.getElementById("nomePaciente").innerText =
  nomePaciente || "Paciente não informado";

document.getElementById("idPaciente").innerText =
  pacienteId || "—";



// ==========================================
// VOLTAR
// ==========================================

function voltar() {

  window.location.href = "medico.html";

}



// ==========================================
// MENSAGEM
// ==========================================

function mostrarMensagem(texto, tipo) {

  const mensagem =
    document.getElementById("mensagem");

  mensagem.innerText = texto;

  mensagem.className =
    "mensagem " + tipo;

  mensagem.style.display = "block";

}



// ==========================================
// SALVAR ALTA
// ==========================================

async function salvarAlta() {

  const btn =
    document.getElementById("btnSalvar");


  const diagnostico =
    document.getElementById("diagnostico").value;

  const orientacoes =
    document.getElementById("orientacoes").value;

  const retorno =
    document.getElementById("retorno").value;

  const observacoes =
    document.getElementById("observacoes").value;



  // VALIDAÇÕES

  if (!pacienteId || !nomePaciente) {

    mostrarMensagem(
      "Paciente não informado.",
      "erro"
    );

    return;

  }


  if (!diagnostico.trim()) {

    mostrarMensagem(
      "Informe o diagnóstico final.",
      "erro"
    );

    return;

  }



  const dadosAlta = {

    pacienteId: pacienteId,

    paciente: nomePaciente,

    diagnostico: diagnostico,

    orientacoes: orientacoes,

    retorno: retorno,

    observacoes: observacoes

  };



  // DESABILITA O BOTÃO

  btn.disabled = true;

  btn.innerText = "Salvando alta...";



  try {


    // ==========================================
    // ENVIA PARA O BACKEND
    // ==========================================

    const response = await fetch("/alta", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(dadosAlta)

    });



    const data = await response.json();



    if (!response.ok) {

      throw new Error(
        data.erro || "Erro ao registrar alta."
      );

    }



    // ==========================================
    // GERA O PDF
    // ==========================================

    gerarPDF(dadosAlta);



    mostrarMensagem(
      "✅ Alta registrada e PDF gerado com sucesso!",
      "sucesso"
    );


    btn.innerText = "Alta Registrada";



  } catch (error) {


    console.error("Erro na alta:", error);


    mostrarMensagem(
      "Erro ao salvar alta: " + error.message,
      "erro"
    );


    btn.disabled = false;

    btn.innerText =
      "🏥 Confirmar Alta e Gerar PDF";


  }

}



// ==========================================
// GERAR PDF
// ==========================================

function gerarPDF(dados) {


  // Verifica se a biblioteca carregou

  if (!window.jspdf || !window.jspdf.jsPDF) {

    alert(
      "A biblioteca de PDF não carregou. Verifique sua conexão com a internet."
    );

    return;

  }


  const { jsPDF } = window.jspdf;


  const doc = new jsPDF();



  // ==========================================
  // CONFIGURAÇÕES
  // ==========================================

  const margem = 20;

  const larguraPagina = 210;

  const larguraTexto =
    larguraPagina - margem * 2;



  let y = 20;



  // ==========================================
  // CABEÇALHO
  // ==========================================

  doc.setFont("helvetica", "bold");

  doc.setFontSize(18);

  doc.text(
    "SISTEMA HOSPITALAR",
    larguraPagina / 2,
    y,
    { align: "center" }
  );


  y += 10;


  doc.setFontSize(15);

  doc.text(
    "DOCUMENTO DE ALTA HOSPITALAR",
    larguraPagina / 2,
    y,
    { align: "center" }
  );


  y += 15;



  // LINHA

  doc.setLineWidth(0.5);

  doc.line(
    margem,
    y,
    larguraPagina - margem,
    y
  );


  y += 15;



  // ==========================================
  // INFORMAÇÕES DO PACIENTE
  // ==========================================

  doc.setFontSize(12);

  doc.setFont("helvetica", "bold");

  doc.text(
    "DADOS DO PACIENTE",
    margem,
    y
  );


  y += 10;


  doc.setFont("helvetica", "normal");

  doc.setFontSize(11);


  doc.text(
    "Nome: " + dados.paciente,
    margem,
    y
  );


  y += 8;


  doc.text(
    "ID do paciente: " + dados.pacienteId,
    margem,
    y
  );


  y += 8;


  doc.text(
    "Data da alta: " + new Date().toLocaleString("pt-BR"),
    margem,
    y
  );


  y += 15;



  // ==========================================
  // FUNÇÃO PARA ESCREVER TEXTOS
  // ==========================================

  function escreverCampo(titulo, texto) {


    doc.setFont("helvetica", "bold");

    doc.text(
      titulo,
      margem,
      y
    );


    y += 7;


    doc.setFont("helvetica", "normal");


    const linhas = doc.splitTextToSize(
      texto || "Não informado",
      larguraTexto
    );


    doc.text(
      linhas,
      margem,
      y
    );


    y += linhas.length * 6 + 8;



    // Se estiver chegando perto do final da página,
    // cria uma nova página

    if (y > 270) {

      doc.addPage();

      y = 20;

    }

  }



  // ==========================================
  // INFORMAÇÕES DA ALTA
  // ==========================================

  escreverCampo(
    "O QUE O PACIENTE TINHA / DIAGNÓSTICO:",
    dados.diagnostico
  );


  escreverCampo(
    "ORIENTAÇÕES AO PACIENTE:",
    dados.orientacoes
  );


  escreverCampo(
    "RETORNO:",
    dados.retorno
  );


  escreverCampo(
    "OBSERVAÇÕES:",
    dados.observacoes
  );



  // ==========================================
  // RODAPÉ
  // ==========================================

  if (y > 250) {

    doc.addPage();

    y = 20;

  }


  y += 10;


  doc.setFontSize(10);

  doc.setFont("helvetica", "italic");


  doc.text(
    "Documento gerado pelo Sistema Hospitalar",
    larguraPagina / 2,
    y,
    { align: "center" }
  );



  // ==========================================
  // NOME DO ARQUIVO
  // ==========================================

  const nomeArquivo =
    "Alta_" +
    dados.paciente
      .replace(/[^a-zA-Z0-9À-ÿ ]/g, "")
      .replace(/\s+/g, "_") +
    ".pdf";



  // ==========================================
  // DOWNLOAD AUTOMÁTICO
  // ==========================================

  doc.save(nomeArquivo);

}


</script>

</body>

</html>
