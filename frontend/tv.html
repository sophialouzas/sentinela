<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mídia Indoor - TV</title>
  <style>
  /* =========================================
     CONFIGURAÇÃO GERAL
     ========================================= */

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family: Arial, sans-serif;
  }

  body {
    background:
      radial-gradient(
        circle at top left,
        #164d6b 0%,
        #0b263d 45%,
        #071c2d 100%
      );

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    overflow: hidden;
  }


  /* =========================================
     CONTAINER PRINCIPAL DA TV
     ========================================= */

  .tv-container {
    display: flex;

    width: 95vw;

    height: 90vh;

    gap: 18px;
  }


  /* =========================================
     PAINEL ESQUERDO
     ========================================= */

  .left-panel {
    display: flex;

    flex-direction: column;

    width: 35%;

    gap: 18px;
  }


  /* =========================================
     PAINEL DIREITO
     ========================================= */

  .right-panel {
    display: flex;

    flex-direction: column;

    width: 65%;

    gap: 18px;
  }


  /* =========================================
     CAIXAS
     ========================================= */

  .box {
    background:
      linear-gradient(
        145deg,
        #f8fcfd,
        #eaf5f7
      );

    border: 2px solid #8fcbd1;

    border-radius: 16px;

    padding: 20px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.22),
      inset 0 0 20px rgba(25, 191, 196, 0.05);

    position: relative;

    overflow: hidden;
  }

  .box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 4px;

    background:
      linear-gradient(
        90deg,
        #19bfc4,
        #167c91,
        #19bfc4
      );
  }


  /* =========================================
     TÍTULOS
     ========================================= */

  .box-title {
    color: #123b5d;

    font-size: 2.2vw;

    font-weight: bold;

    text-transform: uppercase;

    text-shadow:
      0 1px 2px rgba(18, 59, 93, 0.12);

    margin-bottom: 12px;
  }


  /* =========================================
     LOCAL / CONSULTÓRIO
     ========================================= */

  .local-box {
    flex: 1;
  }

  .local-number {
    color: #167c91;

    font-size: 9vw;

    font-weight: bold;

    line-height: 1;

    text-shadow:
      0 0 18px rgba(25, 191, 196, 0.22);
  }

  .local-type {
    color: #456875;

    font-size: 1.8vw;

    font-weight: bold;

    margin-top: 6px;

    letter-spacing: 1px;
  }


  /* =========================================
     HISTÓRICO
     ========================================= */

  .history-box {
    flex: 1;

    justify-content: flex-start;

    align-items: flex-start;
  }

  .history-box .box-title {
    font-size: 1.8vw;

    align-self: center;

    margin-bottom: 15px;
  }

  #history-list {
    list-style: none;

    width: 100%;

    color: #167c91;

    font-size: 1.5vw;

    font-weight: bold;

    text-align: left;
  }

  #history-list li {
    margin-bottom: 8px;

    border-bottom:
      1px solid #c8dfe3;

    padding-bottom: 7px;

    transition: all 0.2s ease;
  }

  #history-list li:last-child {
    border-bottom: none;
  }


  /* =========================================
     PACIENTE ATUAL
     ========================================= */

  .patient-box {
    flex: 3;

    background:
      linear-gradient(
        145deg,
        #ffffff,
        #edf9fa
      );

    border-color: #19bfc4;

    box-shadow:
      0 12px 35px rgba(0, 0, 0, 0.25),
      0 0 25px rgba(25, 191, 196, 0.10);
  }

  .patient-name {
    color: #123b5d;

    font-size: 6.5vw;

    font-weight: bold;

    line-height: 1.2;

    word-break: break-word;

    text-shadow:
      0 2px 5px rgba(18, 59, 93, 0.12);
  }


  /* =========================================
     LOGO / IDENTIFICAÇÃO
     ========================================= */

  .logo-box {
    flex: 1;

    background:
      linear-gradient(
        135deg,
        #0f405e,
        #123b5d
      );

    border-color: #19bfc4;
  }

  .logo-text {
    color: #ffffff;

    font-size: 3.5vw;

    font-weight: bold;

    text-transform: uppercase;

    letter-spacing: 2px;

    text-shadow:
      0 0 12px rgba(25, 191, 196, 0.55);
  }


  /* =========================================
     ANIMAÇÃO DE CHAMADA
     ========================================= */

  @keyframes flash {

    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.35;
    }

  }

  .flash {
    animation:
      flash 0.5s ease 3;
  }


  /* =========================================
     RESPONSIVIDADE
     ========================================= */

  @media (max-width: 700px) {

    .tv-container {
      width: 96vw;

      height: 94vh;

      gap: 10px;
    }

    .box {
      padding: 12px;

      border-radius: 12px;
    }

    .box-title {
      font-size: 4vw;
    }

    .history-box .box-title {
      font-size: 3.5vw;
    }

    .local-number {
      font-size: 13vw;
    }

    .local-type {
      font-size: 3vw;
    }

    #history-list {
      font-size: 2.5vw;
    }

    .patient-name {
      font-size: 8vw;
    }

    .logo-text {
      font-size: 5vw;
    }

  }
</style>
</head>
<body>

<!-- Estrutura da tela da TV criada para exibir o local e o nome do paciente chamado -->
<div class="tv-container">
  <div class="left-panel">
    <div class="box local-box">
      <div class="box-title" id="local-tipo">GUICHÊ</div>
      <div class="local-number" id="local-numero">--</div>
    </div>
    <div class="box history-box">
      <div class="box-title">ÚLTIMAS CHAMADAS</div>
      <ul id="history-list"></ul>
    </div>
  </div>
  <div class="right-panel">
    <div class="box patient-box">
      <div class="box-title">PACIENTE</div>
      <div class="patient-name" id="patient-name">AGUARDANDO...</div>
    </div>
    <div class="box logo-box">
      <div class="logo-text">🏥 Sistema Hospitalar</div>
    </div>
  </div>
</div>

<script>
let ultimoId = null;

// Função criada para buscar a chamada atual e o histórico da TV em tempo real.
function atualizar() {
  fetch("/tv/chamada")
    .then(r => r.json())
    .then(data => {
      const chamada = data.chamada;
      const historico = data.historico || [];

      if (chamada) {
        document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHÊ";
        document.getElementById("local-numero").innerText = chamada.localNumero || "--";
        document.getElementById("patient-name").innerText = chamada.paciente || "AGUARDANDO...";

        // Flash visual quando há chamada nova
        if (chamada.id !== ultimoId) {
          ultimoId = chamada.id;
          const patientBox = document.querySelector(".patient-box");
          patientBox.classList.remove("flash");
          void patientBox.offsetWidth; // reflow
          patientBox.classList.add("flash");
        }
      }

      // Histórico
      const list = document.getElementById("history-list");
      list.innerHTML = "";
      historico.slice(0, 4).forEach(h => {
        const li = document.createElement("li");
        const tipo = h.localTipo ? h.localTipo.substring(0,4) : "GUIC";
        li.innerText = `${tipo}. ${h.localNumero} - ${h.paciente}`;
        list.appendChild(li);
      });
    })
    .catch(err => console.log("Erro ao buscar chamada:", err));
}

// Polling a cada 2 segundos
atualizar();
setInterval(atualizar, 2000);
</script>

</body>
</html>
